- id: donor-by-financing
  title: { fr: "Par votation, élection ou année", de: "Nach Abstimmung, Wahl oder Jahr", it: "Per votazione, elezione o anno", en: "By vote, election or year" }
  subtitle: { fr: "Décompte final, sinon budget", de: "Schlussrechnung, sonst Budget", it: "Conto finale, altrimenti preventivo", en: "Final accounts, otherwise budget" }
  query: { dataset: flow, group_by: [financing_id, stance], measure: [sum:value_chf, count], limit: 50, filter: { is_latest: 'true' } }
  params: { donor_id: donor_id }
  chart: { type: bars, label: financing_id, value: sum_value_chf, color: stance, link: financing }
- id: donor-alignment
  title: { fr: "Alignement avec les recommandations de vote", de: "Übereinstimmung mit den Abstimmungsparolen", it: "Allineamento con le raccomandazioni di voto", en: "Alignment with voting recommendations" }
  subtitle: { fr: "Part de l'argent versé au camp recommandé par chaque parti ou association, sur les votations où il a recommandé Oui ou Non", de: "Anteil des Geldes, das an das von der Partei oder dem Verband empfohlene Lager ging – bei Abstimmungen mit Ja- oder Nein-Parole", it: "Quota del denaro versato al fronte raccomandato da ciascun partito o associazione, nelle votazioni in cui ha raccomandato Sì o No", en: "Share of the money given to the side each party or federation recommended, on votes where it recommended Yes or No" }
  note:
    fr: "Calcul : pour chaque votation où un parti ou une association a recommandé Oui ou Non, on regarde de quel côté est allé l'argent de ce donateur ; le pourcentage est la part de ses dons (en francs) versée au camp recommandé. Il est calculé uniquement à partir des dons déclarés au CDF et ne dit rien des opinions politiques de la personne ou de l'organisation : un don peut avoir de nombreuses raisons. Avec peu de votations, le chiffre est peu significatif."
    de: "Berechnung: Für jede Abstimmung, zu der eine Partei oder ein Verband die Ja- oder Nein-Parole beschlossen hat, wird geprüft, an welches Lager das Geld dieser Zuwendenden ging; der Prozentsatz ist der Anteil ihrer Zuwendungen (in Franken), der an das empfohlene Lager ging. Er beruht ausschliesslich auf den bei der EFK deklarierten Zuwendungen und sagt nichts über die politische Meinung der Person oder Organisation aus: Eine Zuwendung kann viele Gründe haben. Bei wenigen Abstimmungen ist der Wert wenig aussagekräftig."
    it: "Calcolo: per ogni votazione in cui un partito o un'associazione ha raccomandato Sì o No, si osserva a quale fronte è andato il denaro di questo donatore; la percentuale è la quota delle sue liberalità (in franchi) versata al fronte raccomandato. È calcolata unicamente sulla base delle liberalità dichiarate al CDF e non dice nulla delle opinioni politiche della persona o dell'organizzazione: una donazione può avere molte ragioni. Con poche votazioni, il dato è poco significativo."
    en: "How it's calculated: for each vote on which a party or federation recommended Yes or No, we look at which side this donor's money went to; the percentage is the share of their donations (in francs) that went to the recommended side. It is computed solely from donations declared to the Swiss Federal Audit Office and says nothing about the political opinions of the person or organisation: a donation can have many reasons. With few votes, the figure means little."
  query: { dataset: alignment, group_by: [recommender_id], measure: [share:aligned, sum:value_chf, count_distinct:financing_id], order: -share_aligned, limit: 20 }
  params: { donor_id: donor_id }
  chart: { type: share, label: recommender_id, value: share_aligned, color: recommender_id }
- id: donor-by-actor
  title: { fr: Bénéficiaires, de: Empfänger, it: "Beneficiari", en: "Recipients" }
  subtitle: { fr: "Décompte final, sinon budget", de: "Schlussrechnung, sonst Budget", it: "Conto finale, altrimenti preventivo", en: "Final accounts, otherwise budget" }
  query: { dataset: flow, group_by: [actor_id], measure: [sum:value_chf, count], limit: 30, filter: { is_latest: 'true' } }
  params: { donor_id: donor_id }
  chart: { type: bars, label: actor_id, value: sum_value_chf, link: actor }
- id: donor-list
  title: { fr: Toutes les libéralités, de: Alle Zuwendungen, it: "Tutte le liberalità", en: "All donations" }
  query: { dataset: flow, columns: [granted_on, financing_id, phase, stance, actor_id, nature, value_chf], order: -granted_on, limit: 200 }
  params: { donor_id: donor_id }
  chart: { type: table, columns: [granted_on, financing_id, phase, stance, actor_id, nature, value_chf] }
